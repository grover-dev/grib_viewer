# A boatforge invocation: one output directory, and the runs that fill it.
# Every key maps onto a member of Sim::config_t / Sim::run_t.
#
#   boatforge config/example.yaml
#
# Relative paths (out_directory, solar_field, current_u_field, current_v_field)
# resolve against this file's directory, so a config travels with the data it
# names.

out_directory: ../out

# Parts of a split field (see solar_field below) held in memory at once. Runs
# are stepped round-robin over one shared field, so this wants to be at least
# the number of *different parts* the runs are sampling at any moment: with a
# smaller cache, each alternation between two runs in different parts evicts the
# part the other is about to ask for and pays to decompress it again. A sweep of
# start days landing either side of one boundary is happy at 2; spread the sweep
# wider and raise this, at one part's worth of memory each (whatever --max-mib
# grib_npz.py was given, so 512 MiB by default).
#
# Applies to every field a run names, the currents included, and is counted per
# field rather than across all of them -- three split fields at 2 is six parts
# resident, not two. Ignored by a field that is a single npz: there is nothing
# to evict.
field_cache_parts: 2

# Applied to every run below. A run repeating one of these keys overrides it
# for itself, so a sweep only has to write the field that varies -- which for a
# start-day sweep is start_time, and nothing else.
defaults:
  # Gridded solar field, as written by scripts/grib_npz.py. Runs naming the
  # same path share a single load.
  #
  # Either a single npz, or a directory of the parts grib_npz.py writes when
  # one cube would exceed its byte limit (name.000.npz, name.001.npz, ...).
  # Which one it is comes from what is on disk, so pointing this at a directory
  # is the whole of the change -- a split field then loads only the parts being
  # sampled, and field_cache_parts above decides how many that is. The parts
  # have to share a grid and a time step; a directory mixing fields is refused
  # rather than sampled inconsistently.
  # solar_field: ../data/ssrd_global_20250101_10.npz
  # solar_field: ../data/ssrd_global_2025          # a directory of parts
  # solar_field: ../data/ssrd_global_2025_jan.npz
  solar_field: ../sample_data/ssrd

  # Ocean current, as two components rather than a speed and a bearing:
  # current_u_field is eastward (uo), current_v_field is northward (vo). Same
  # form as solar_field and the same cache, so a path named twice is loaded
  # once -- but give each component its own directory. A directory is read as
  # the parts of *one* field, and u and v share a grid and a time step, so a
  # directory holding both would load as one field with every frame duplicated
  # and half of them pointing the wrong way.
  #
  # They are stored as components because that is the only way they interpolate
  # correctly. A stored bearing has a seam at 0/360 that linear interpolation
  # puts 180 degrees out, and a stored speed cannot pass through zero: across a
  # shear where the flow reverses, the truth is slack water but interpolated
  # speed stays at full strength. The sim samples each component and derives
  # the heading and speed from the pair, once, in OceanCurrentField::sample.
  #
  # Written by scripts/netcdf4_npz.py from a CMEMS physics product, one
  # directory per component:
  #   mkdir -p data/current_u data/current_v
  #   netcdf4_npz.py <file>.nc uo data/current_u/uo.npz --at depth=0
  #   netcdf4_npz.py <file>.nc vo data/current_v/vo.npz --at depth=0
  # Each writes uo.000.npz, uo.001.npz, ... into its directory once the cube
  # passes --max-mib, and a selection small enough not to split leaves a single
  # npz there, which loads the same way. --at depth=0 takes the shallowest
  # level; say it explicitly so the config records which level is being sailed.
  #
  # Both or neither -- a run naming one without the other is refused. Omit both
  # and the run simply has no current: ocean_current_* stay at zero.
  current_u_field: ../sample_data/uo
  current_v_field: ../sample_data/vo

  # Degrees, WGS84. Approximately LA
  # start: { lat: 33.5, lon: -120.0 }
  # # Approx Hawaii
  # end: { lat: 19.0, lon: -154.0 }

  # drake passage
  # start: { lat: -58, lon: -55.0 }
  # # ...to further off the coast of spain.
  # end: { lat: -58.0, lon: -72.0 }

  start: { lat: -58, lon: -72.0 }
  # ...to further off the coast of spain.
  end: { lat: -58.0, lon: -55.0 }

  # Steps of blackboard::time_step (1 h) before a run gives up.
  max_steps: 1000

# Each run is written to <out_directory>/<name>.npz, so the names have to be
# distinct -- the loader refuses a config where two runs would collide. Omit
# `name` and it is filled in from the run's position (run_00, run_01, ...).
#
# An entry carrying `count` is a sweep: the same run repeated at a fixed
# interval, with only the departure moving. It expands into ordinary runs before
# anything else sees it, so `count: 6` here and six hand-written entries below
# produce exactly the same six output files -- the sweep form is shorthand, not
# a different kind of run.
#
#   count   how many runs, including the first. 1 is a plain run.
#   every   spacing between departures: `1d`, `12h`, `90m`, `0.5d`, or bare
#           seconds. Required once count > 1, since otherwise every run in the
#           sweep would depart at the same instant.
#
# The runs are named <name>_00, <name>_01, ... zero-padded to the width of the
# count, so `ls` and a glob both give them back in departure order. Hand-write
# the entries instead when the names matter, or when more than the start time
# varies between them.
runs:
  # Six departures, one a day apart, starting at noon on 2 January -- which is
  # the shape of a start-day study: same route, same boat, different weather.
  # Writes jan_00.npz .. jan_05.npz.
  - name: jan
    start_time: 2025-01-01T12:00:00Z
    count: 1
    every: 1d

  # Twice a day for three days, from the same departure. Overlaps the sweep
  # above in time but not in name, so both can run in one invocation.
  # - name: jan_twice_daily
  #   start_time: 2025-01-02T00:00:00Z
  #   count: 6
  #   every: 12h

  # A single run is just a sweep of one, so `count` can be left off entirely.
  # Departure, UTC: either an ISO stamp as here, or plain seconds since the Unix
  # epoch (1735819200 is the same instant).
  # - name: jan02
  #   start_time: 2025-01-02T12:00:00Z

  # The field is a 10-day cut from the 1st, and 1000 hourly steps is far past
  # its end -- so a sweep reaching beyond the axis samples NaN for its tail and
  # stops there. Widen the npz, or trim count/max_steps, before reading anything
  # into the power numbers of the later runs.
  # - name: jan08
  #   start_time: 2025-01-08T12:00:00Z

  # Overriding a default: same departure as the sweep's first run, different
  # destination. Anything from `defaults:` can be overridden per entry, and a
  # sweep applies the override to every run it expands into.
  # - name: jan02_south
  #   start_time: 2025-01-02T12:00:00Z
  #   end: {lat: 34.0, lon: -20.0}
